<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>สมาชิกสหกรณ์ - สถานะของฉัน</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; margin: 0; background: #f4f6f9; color: #222; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
    h5 { margin: 0 0 8px; font-size: 1.1rem; }
    .row-line { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: .95rem; }
    .row-line:last-child { border-bottom: 0; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: .8rem; background: #eee; white-space: nowrap; align-self: center; }
    .muted { color: #888; }
    .center { text-align: center; padding: 40px 16px; color: #888; }
    .btn { display: inline-block; margin-top: 12px; padding: 10px 20px; border: 0; border-radius: 8px; background: #06c755; color: #fff; font: inherit; }
    .btn-outline { background: #fff; color: #06c755; border: 1px solid #06c755; }
    .btn[disabled] { opacity: .6; }
    .profile-row { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #eee; flex: none; }
    .field { margin-top: 10px; }
    .field label { display: block; font-size: .85rem; color: #555; margin-bottom: 4px; }
    .field input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font: inherit; }
    .error-text { color: #d3302f; font-size: .9rem; margin-top: 8px; }
    .secondary { margin-top: 18px; padding-top: 14px; border-top: 1px solid #f0f0f0; font-size: .85rem; }
  </style>
</head>
<body>
  <div id="app"><div class="center">กำลังโหลด...</div></div>

  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script>
    var esc = lmcp.esc;
    var STATUS_LABEL = { DRAFT: 'รอส่งเอกสาร', SUBMITTED: 'รอตรวจสอบ', UNDER_REVIEW: 'กำลังตรวจสอบ', APPROVED: 'อนุมัติแล้ว', REJECTED: 'ไม่อนุมัติ', PAID: 'จ่ายเงินแล้ว' };

    function show(html) { document.getElementById('app').innerHTML = html; }

    function card(html) { return '<div class="card">' + html + '</div>'; }

    function profileRow(profile, fallbackName) {
      return '<div class="profile-row">' +
        (profile && profile.pictureUrl ? '<img class="avatar" src="' + esc(profile.pictureUrl) + '" alt="">' : '') +
        '<h5>สวัสดีคุณ' + esc((profile && profile.displayName) || fallbackName || '') + '</h5></div>';
    }

    function renderVerified(profile, m, claims) {
      var claimsHtml = '<div class="center">ยังไม่มีประวัติ</div>';
      if (claims.length) {
        claimsHtml = claims.map(function (c) {
          return '<div class="row-line"><span>' + esc(c.TypeLabel) + '<br><small class="muted">' +
            esc(c.SubmittedAt ? new Date(c.SubmittedAt).toLocaleDateString('th-TH') : '-') + '</small></span>' +
            '<span class="badge">' + esc(STATUS_LABEL[c.Status] || c.Status) + '</span></div>';
        }).join('');
      }
      show(
        card(profileRow(profile, m.DisplayName) + '<span class="badge">สมาชิกเลขที่ ' + esc(m.MemberNo) + '</span>') +
        card('<div class="row-line"><span>สังกัด</span><span>' + esc(m.Affiliation || '-') + '</span></div>' +
          '<div class="row-line"><span>อายุการเป็นสมาชิก</span><span>' + (m.YearsOfMembership != null ? esc(m.YearsOfMembership) + ' ปี' : '-') + '</span></div>') +
        card('<h5>ประวัติการยื่นขอสวัสดิการ</h5>' + claimsHtml)
      );
    }

    function renderUnverified(profile, decoded, idToken, errorMsg) {
      show(
        card(profileRow(profile, decoded.name || 'สมาชิก')) +
        card(
          '<p class="muted">ยังไม่ได้ยืนยันตัวตนสมาชิก กรอกเลขที่สมาชิกและเลขบัตรประชาชนเพื่อยืนยัน</p>' +
          (errorMsg ? '<p class="error-text">' + esc(errorMsg) + '</p>' : '') +
          '<form id="linkForm">' +
            '<div class="field"><label>เลขที่สมาชิก</label><input name="memberNo" required autocomplete="off"></div>' +
            '<div class="field"><label>เลขประจำตัวประชาชน (13 หลัก)</label><input name="nationalId" required inputmode="numeric" maxlength="13" autocomplete="off"></div>' +
            '<button type="submit" class="btn">ยืนยันตัวตน</button>' +
          '</form>' +
          '<div class="secondary muted">หรือกลับไปที่แชทของสหกรณ์ แล้วพิมพ์ "เลขที่สมาชิก เลขบัตรประชาชน" เพื่อยืนยันตัวตนก็ได้' +
            (liff.isInClient() ? '<br><button class="btn btn-outline" onclick="liff.closeWindow()">กลับไปที่แชท</button>' : '') +
          '</div>'
        )
      );

      document.getElementById('linkForm').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var form = ev.target;
        var memberNo = form.memberNo.value.trim();
        var nationalId = form.nationalId.value.trim();
        var btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'กำลังยืนยัน...';
        lmcp.api('linkMember', { idToken: idToken, memberNo: memberNo, nationalId: nationalId }).then(function (res) {
          if (!res.ok) {
            renderUnverified(profile, decoded, idToken, res.message);
            return;
          }
          return lmcp.api('getMyStatus', { idToken: idToken }).then(function (statusRes) {
            if (statusRes.ok) {
              renderVerified(profile, statusRes.member, statusRes.claims);
            } else {
              renderVerified(profile, res.member, []);
            }
          });
        }).catch(function (err) {
          renderUnverified(profile, decoded, idToken, err.message || 'เชื่อมต่อไม่สำเร็จ กรุณาลองใหม่');
        });
      });
    }

    async function getLiffId() {
      if (lmcp.config.LIFF_ID) return lmcp.config.LIFF_ID;
      var cfg = await lmcp.api('getPublicConfig', {});
      return cfg.liffId || '';
    }

    async function boot() {
      var liffId = await getLiffId();
      if (!liffId) {
        show('<div class="center">ยังไม่ได้ตั้งค่า LIFF_ID (ตั้งค่าที่หน้า setup.html หรือ assets/config.js)</div>');
        return;
      }
      await liff.init({ liffId: liffId });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }

      // ส่ง ID token ให้ backend ตรวจกับ LINE เอง — ไม่ส่ง userId ตรง ๆ (ปลอมได้)
      var idToken = liff.getIDToken();
      if (!idToken) {
        show('<div class="center">LIFF app ยังไม่ได้เปิด scope "openid" — แจ้งผู้ดูแลระบบให้เปิดใน LINE Developers Console</div>');
        return;
      }
      var decoded = liff.getDecodedIDToken() || {};
      var profile = null;
      try { profile = await liff.getProfile(); } catch (e) { /* scope "profile" อาจยังไม่เปิด — แสดงหน้าต่อได้โดยไม่มีรูป */ }

      var res = await lmcp.api('getMyStatus', { idToken: idToken });

      // ID token ที่ LIFF cache ไว้อาจหมดอายุ (เปิดแอปค้างไว้นาน) — login ใหม่ 1 ครั้งเพื่อขอ token ใหม่
      if (!res.ok && /ยืนยันตัวตนกับ LINE/.test(res.message || '')) {
        var retried = false;
        try { retried = sessionStorage.getItem('lmcp_liff_relogin') === '1'; sessionStorage.setItem('lmcp_liff_relogin', '1'); } catch (e) {}
        if (!retried) { liff.logout(); liff.login({ redirectUri: location.href }); return; }
      }
      try { sessionStorage.removeItem('lmcp_liff_relogin'); } catch (e) {}

      if (!res.ok) {
        // ข้อความ "ยังไม่ได้ยืนยันตัวตนสมาชิก" เป็นกรณีปกติ (ซ้ำกับข้อความในฟอร์มอยู่แล้ว) ส่วนข้อความอื่นคือ error ที่ไม่คาดคิด ควรโชว์ให้เห็น
        renderUnverified(profile, decoded, idToken, res.message === 'ยังไม่ได้ยืนยันตัวตนสมาชิก' ? null : res.message);
        return;
      }

      renderVerified(profile, res.member, res.claims);
    }

    boot().catch(function (err) {
      show('<div class="center">เกิดข้อผิดพลาด: ' + esc(err.message || err) +
        '<br><button class="btn" onclick="location.reload()">ลองใหม่</button></div>');
    });
  </script>
</body>
</html>
