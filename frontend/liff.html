<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>สมาชิกสหกรณ์ - สถานะของฉัน</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --color-primary: #06c755;
      --color-primary-dark: #059c44;
      --color-primary-tint: rgba(6, 199, 85, .1);
      --color-text: #1a1d1f;
      --color-text-muted: #6b7280;
      --color-border: #e6e8eb;
      --color-bg: #f5f6f8;
      --color-surface: #ffffff;
      --color-danger: #d3302f;
      --color-danger-tint: #fdf1f1;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 1px 2px rgba(16,24,40,.04), 0 2px 8px rgba(16,24,40,.05);
    }
    * { box-sizing: border-box; }
    body { font-family: 'Sarabun', sans-serif; margin: 0; background: var(--color-bg); color: var(--color-text); -webkit-font-smoothing: antialiased; }
    #app { max-width: 480px; margin: 0 auto; padding-bottom: 28px; }
    .card { background: var(--color-surface); border-radius: var(--radius); padding: 20px; margin: 16px 16px 0; box-shadow: var(--shadow); }
    .card:last-child { margin-bottom: 16px; }
    h5 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 700; line-height: 1.4; }
    p { line-height: 1.65; margin: 0 0 10px; }
    p:last-child { margin-bottom: 0; }
    .row-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--color-border); font-size: .95rem; }
    .row-line:last-child { border-bottom: 0; }
    .row-line > span:first-child { color: var(--color-text-muted); }
    .badge { display: inline-flex; align-items: center; padding: 3px 11px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: #eef0f2; color: #52565c; white-space: nowrap; }
    .badge-accent { background: var(--color-primary-tint); color: var(--color-primary-dark); }
    .muted { color: var(--color-text-muted); }
    .center { text-align: center; padding: 60px 20px; color: var(--color-text-muted); font-size: .95rem; line-height: 1.7; }
    .spinner { width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%; border: 3px solid var(--color-border); border-top-color: var(--color-primary); animation: spin .7s linear infinite; }
    .btn-spinner { width: 16px; height: 16px; margin-right: 8px; border-radius: 50%; border: 2px solid rgba(255,255,255,.45); border-top-color: #fff; animation: spin .6s linear infinite; flex: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn { display: flex; align-items: center; justify-content: center; width: 100%; margin-top: 4px; padding: 13px 20px; border: 0; border-radius: var(--radius-sm); background: var(--color-primary); color: #fff; font: inherit; font-size: .95rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: background-color .15s ease, opacity .15s ease; }
    .btn:hover { background: var(--color-primary-dark); }
    .btn:focus-visible { outline: 2px solid var(--color-primary-dark); outline-offset: 2px; }
    .btn[disabled] { opacity: .55; cursor: not-allowed; }
    .btn-outline { background: var(--color-surface); color: var(--color-primary-dark); border: 1.5px solid var(--color-primary); }
    .btn-outline:hover { background: var(--color-primary-tint); }
    .btn-row { display: flex; gap: 10px; margin-top: 18px; }
    .btn-row .btn { margin-top: 0; }
    .profile-row { display: flex; align-items: center; gap: 14px; }
    .avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--color-border); flex: none; }
    .field { margin-top: 14px; }
    .field:first-child { margin-top: 0; }
    .field label { display: block; font-size: .85rem; font-weight: 500; color: var(--color-text-muted); margin-bottom: 6px; }
    .field input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--color-border); border-radius: var(--radius-sm); font: inherit; font-size: .95rem; color: var(--color-text); transition: border-color .15s ease; }
    .field input:focus { outline: none; border-color: var(--color-primary); }
    .field input::placeholder { color: #b0b4ba; }
    .error-text { color: var(--color-danger); background: var(--color-danger-tint); border-radius: var(--radius-sm); padding: 11px 13px; font-size: .88rem; line-height: 1.55; margin-top: 14px; }
    .secondary { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--color-border); font-size: .85rem; }
    .secondary .btn-outline { margin-top: 12px; }
  </style>
</head>
<body>
  <div id="app"><div class="center"><div class="spinner"></div>กำลังโหลด...</div></div>

  <script src="assets/config.js"></script>
  <script src="assets/api.js"></script>
  <script>
    var esc = lmcp.esc;
    var STATUS_LABEL = { DRAFT: 'รอส่งเอกสาร', SUBMITTED: 'รอตรวจสอบ', UNDER_REVIEW: 'กำลังตรวจสอบ', APPROVED: 'อนุมัติแล้ว', REJECTED: 'ไม่อนุมัติ', PAID: 'จ่ายเงินแล้ว' };

    // ⚠️ TODO: ใส่ช่องทางติดต่อเจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคลของสหกรณ์จริงตรง [กรุณาระบุ] ก่อนเปิดใช้งานจริง
    var PDPA_NOTICE_HTML =
      '<h5>ประกาศความเป็นส่วนตัว (Privacy Notice)</h5>' +
      '<p class="muted">สำหรับสมาชิกสหกรณ์ออมทรัพย์สาธารณสุขจังหวัดมุกดาหาร</p>' +
      '<p>สหกรณ์ออมทรัพย์สาธารณสุขจังหวัดมุกดาหาร ("สหกรณ์") ในฐานะผู้ควบคุมข้อมูลส่วนบุคคล ขอแจ้งให้ท่านทราบเกี่ยวกับการเก็บรวบรวม ใช้ ' +
      'และเปิดเผยข้อมูลส่วนบุคคลของท่านผ่านระบบ LINE Official Account ของสหกรณ์ ดังนี้</p>' +
      '<p><b>1. ข้อมูลที่เก็บรวบรวม</b><br>' +
      'เลขที่สมาชิกและเลขประจำตัวประชาชน (ใช้ยืนยันตัวตนเท่านั้น), LINE User ID และข้อมูลโปรไฟล์ LINE (ชื่อที่แสดง/รูปโปรไฟล์), ' +
      'และประวัติการใช้งานที่ท่านส่งผ่านระบบ เช่น คำขอรับสวัสดิการ หรือหลักฐานการโอนเงิน</p>' +
      '<p><b>2. วัตถุประสงค์</b><br>' +
      'เพื่อยืนยันตัวตนความเป็นสมาชิกก่อนให้บริการผ่านระบบ เพื่อดำเนินการตามคำขอของท่าน และเพื่อจัดเก็บหลักฐาน/ประวัติธุรกรรมตามข้อบังคับสหกรณ์</p>' +
      '<p><b>3. ระยะเวลาเก็บรักษา</b><br>' +
      'ตลอดระยะเวลาที่ท่านเป็นสมาชิกสหกรณ์ และต่อไปตามระยะเวลาที่กฎหมายหรือข้อบังคับสหกรณ์กำหนด</p>' +
      '<p><b>4. การเปิดเผยข้อมูล</b><br>' +
      'สหกรณ์จะไม่เปิดเผยข้อมูลส่วนบุคคลของท่านแก่บุคคลภายนอก เว้นแต่ได้รับความยินยอมจากท่าน หรือเป็นกรณีที่กฎหมายกำหนด</p>' +
      '<p><b>5. สิทธิของท่าน</b><br>' +
      'ท่านมีสิทธิขอเข้าถึง แก้ไข ลบ ระงับการใช้ หรือเพิกถอนความยินยอมที่ให้ไว้ รวมถึงร้องเรียนต่อหน่วยงานที่เกี่ยวข้องได้ตลอดเวลา ' +
      'โดยติดต่อ [กรุณาระบุช่องทางติดต่อเจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคลของสหกรณ์ เช่น อีเมลหรือเบอร์โทร]</p>' +
      '<p class="muted">การกด "ยินยอม" ด้านล่าง ถือว่าท่านได้อ่านและรับทราบประกาศฉบับนี้ และยินยอมให้สหกรณ์เก็บรวบรวม/ใช้ข้อมูลของท่านเพื่อวัตถุประสงค์การยืนยันตัวตนสมาชิกตามที่ระบุไว้</p>';

    function show(html) { document.getElementById('app').innerHTML = html; }

    function card(html) { return '<div class="card">' + html + '</div>'; }

    function chatBackButtonHtml() {
      if (liff.isInClient()) {
        return '<button class="btn btn-outline" onclick="liff.closeWindow()">กลับไปที่แชท</button>';
      }
      var basicId = lmcp.config.OA_BASIC_ID || '';
      if (!basicId) return '';
      var url = 'https://line.me/R/ti/p/' + encodeURIComponent(basicId);
      return '<a class="btn btn-outline" href="' + esc(url) + '" target="_blank" rel="noopener" style="text-decoration:none;">กลับไปที่แชท</a>';
    }

    function profileRow(profile, fallbackName) {
      return '<div class="profile-row">' +
        (profile && profile.pictureUrl ? '<img class="avatar" src="' + esc(profile.pictureUrl) + '" alt="">' : '') +
        '<h5>สวัสดีคุณ' + esc((profile && profile.displayName) || fallbackName || '') + '</h5></div>';
    }

    function renderVerified(profile, m, claims) {
      var claimsHtml = '<div class="center">ยังไม่มีประวัติ</div>';
      if (claims.length) {
        claimsHtml = claims.map(function (c) {
          return '<div class="row-line"><span>' + esc(c.TypeLabel) + '<br><small class="muted">' +
            esc(c.SubmittedAt ? new Date(c.SubmittedAt).toLocaleDateString('th-TH') : '-') + '</small></span>' +
            '<span class="badge">' + esc(STATUS_LABEL[c.Status] || c.Status) + '</span></div>';
        }).join('');
      }
      show(
        card(profileRow(profile, m.DisplayName) + '<span class="badge badge-accent" style="margin-top:12px;display:inline-flex;">สมาชิกเลขที่ ' + esc(m.MemberNo) + '</span>') +
        card('<div class="row-line"><span>สังกัด</span><span>' + esc(m.Affiliation || '-') + '</span></div>' +
          '<div class="row-line"><span>อายุการเป็นสมาชิก</span><span>' + (m.YearsOfMembership != null ? esc(m.YearsOfMembership) + ' ปี' : '-') + '</span></div>') +
        card('<h5>ประวัติการยื่นขอสวัสดิการ</h5>' + claimsHtml) +
        (chatBackButtonHtml() ? card(chatBackButtonHtml()) : '')
      );
    }

    function renderPdpaGate(profile, decoded, idToken) {
      show(
        card(profileRow(profile, decoded.name || 'สมาชิก')) +
        card(
          PDPA_NOTICE_HTML +
          '<div class="btn-row">' +
            '<button id="pdpaDecline" type="button" class="btn btn-outline">ไม่ยินยอม</button>' +
            '<button id="pdpaAccept" class="btn">ยินยอม และดำเนินการต่อ</button>' +
          '</div>'
        )
      );
      document.getElementById('pdpaAccept').addEventListener('click', function () {
        renderUnverified(profile, decoded, idToken, null, true);
      });
      document.getElementById('pdpaDecline').addEventListener('click', function () {
        show(
          card(profileRow(profile, decoded.name || 'สมาชิก')) +
          card(
            '<p class="muted">หากไม่ยินยอม จะไม่สามารถยืนยันตัวตนผ่านฟอร์มในหน้านี้ได้ แต่ยังยืนยันตัวตนผ่านแชทของสหกรณ์ได้ตามปกติ ' +
            'โดยพิมพ์ "เลขที่สมาชิก เลขบัตรประชาชน"</p>' +
            chatBackButtonHtml()
          )
        );
      });
    }

    function renderUnverified(profile, decoded, idToken, errorMsg, pdpaAccepted) {
      if (!pdpaAccepted) { renderPdpaGate(profile, decoded, idToken); return; }

      show(
        card(profileRow(profile, decoded.name || 'สมาชิก')) +
        card(
          '<p class="muted">ยังไม่ได้ยืนยันตัวตนสมาชิก กรอกเลขที่สมาชิกและเลขบัตรประชาชนเพื่อยืนยัน</p>' +
          (errorMsg ? '<p class="error-text">' + esc(errorMsg) + '</p>' : '') +
          '<form id="linkForm">' +
            '<div class="field"><label>เลขที่สมาชิก</label><input name="memberNo" required autocomplete="off"></div>' +
            '<div class="field"><label>เลขประจำตัวประชาชน (13 หลัก)</label><input name="nationalId" required inputmode="numeric" maxlength="13" autocomplete="off"></div>' +
            '<button type="submit" class="btn">ยืนยันตัวตน</button>' +
          '</form>' +
          '<div class="secondary muted">หรือกลับไปที่แชทของสหกรณ์ แล้วพิมพ์ "เลขที่สมาชิก เลขบัตรประชาชน" เพื่อยืนยันตัวตนก็ได้' +
            '<br>' + chatBackButtonHtml() +
          '</div>'
        )
      );

      document.getElementById('linkForm').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var form = ev.target;
        var memberNo = form.memberNo.value.trim();
        var nationalId = form.nationalId.value.trim();
        var btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<span class="btn-spinner"></span>กำลังยืนยัน...';
        lmcp.api('linkMember', { idToken: idToken, memberNo: memberNo, nationalId: nationalId, pdpaConsent: true }).then(function (res) {
          if (!res.ok) {
            renderUnverified(profile, decoded, idToken, res.message, true);
            return;
          }
          return lmcp.api('getMyStatus', { idToken: idToken }).then(function (statusRes) {
            if (statusRes.ok) {
              renderVerified(profile, statusRes.member, statusRes.claims);
            } else {
              renderVerified(profile, res.member, []);
            }
          });
        }).catch(function (err) {
          renderUnverified(profile, decoded, idToken, err.message || 'เชื่อมต่อไม่สำเร็จ กรุณาลองใหม่', true);
        });
      });
    }

    async function getLiffId() {
      if (lmcp.config.LIFF_ID) return lmcp.config.LIFF_ID;
      var cfg = await lmcp.api('getPublicConfig', {});
      return cfg.liffId || '';
    }

    async function boot() {
      var liffId = await getLiffId();
      if (!liffId) {
        show('<div class="center">ยังไม่ได้ตั้งค่า LIFF_ID (ตั้งค่าที่หน้า setup.html หรือ assets/config.js)</div>');
        return;
      }
      await liff.init({ liffId: liffId });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }

      // ส่ง ID token ให้ backend ตรวจกับ LINE เอง — ไม่ส่ง userId ตรง ๆ (ปลอมได้)
      var idToken = liff.getIDToken();
      if (!idToken) {
        show('<div class="center">LIFF app ยังไม่ได้เปิด scope "openid" — แจ้งผู้ดูแลระบบให้เปิดใน LINE Developers Console</div>');
        return;
      }
      var decoded = liff.getDecodedIDToken() || {};
      var profile = null;
      try { profile = await liff.getProfile(); } catch (e) { /* scope "profile" อาจยังไม่เปิด — แสดงหน้าต่อได้โดยไม่มีรูป */ }

      var res = await lmcp.api('getMyStatus', { idToken: idToken });

      // ID token ที่ LIFF cache ไว้อาจหมดอายุ (เปิดแอปค้างไว้นาน) — login ใหม่ 1 ครั้งเพื่อขอ token ใหม่
      if (!res.ok && /ยืนยันตัวตนกับ LINE/.test(res.message || '')) {
        var retried = false;
        try { retried = sessionStorage.getItem('lmcp_liff_relogin') === '1'; sessionStorage.setItem('lmcp_liff_relogin', '1'); } catch (e) {}
        if (!retried) { liff.logout(); liff.login({ redirectUri: location.href }); return; }
      }
      try { sessionStorage.removeItem('lmcp_liff_relogin'); } catch (e) {}

      if (!res.ok) {
        // ข้อความ "ยังไม่ได้ยืนยันตัวตนสมาชิก" เป็นกรณีปกติ (ซ้ำกับข้อความในฟอร์มอยู่แล้ว) ส่วนข้อความอื่นคือ error ที่ไม่คาดคิด ควรโชว์ให้เห็น
        renderUnverified(profile, decoded, idToken, res.message === 'ยังไม่ได้ยืนยันตัวตนสมาชิก' ? null : res.message);
        return;
      }

      renderVerified(profile, res.member, res.claims);
    }

    boot().catch(function (err) {
      show('<div class="center">เกิดข้อผิดพลาด: ' + esc(err.message || err) +
        '<br><button class="btn" onclick="location.reload()">ลองใหม่</button></div>');
    });
  </script>
</body>
</html>
