<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <style>
    body { font-family: 'Sarabun', sans-serif; background: #f4f6f9; }
    .wrap { max-width: 640px; margin: 30px auto; padding: 0 16px 60px; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 16px; }
    .card-header { font-weight: 700; background: #06c755; color: #fff; border-radius: 12px 12px 0 0 !important; }
    label { font-weight: 600; font-size: .9rem; }
    .hint { font-size: .8rem; color: #888; }
    code.copyable { display: block; background: #f1f1f1; padding: 8px 10px; border-radius: 6px; word-break: break-all; font-size: .82rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h4 class="mb-3">ตั้งค่าระบบ LineMCP</h4>
    <div id="content"><div class="text-center text-muted py-5">กำลังโหลด...</div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    var BASE_URL = <?!= JSON.stringify(baseUrl) ?>;
    var TOKEN = localStorage.getItem('lmcp_token') || '';

    // กัน race condition: หน้าเว็บโหลด/รัน inline script เร็วกว่า Apps Script bridge (google.script.run) จะพร้อมใช้
    function waitForGasRun_() {
      return new Promise(function (resolve, reject) {
        var tries = 0;
        (function check() {
          if (window.google && window.google.script && window.google.script.run) return resolve();
          if (++tries > 100) return reject(new Error('เชื่อมต่อระบบไม่สำเร็จ กรุณารีเฟรชหน้าใหม่ (Apps Script bridge โหลดไม่ทัน)'));
          setTimeout(check, 50);
        })();
      });
    }

    function rpc(name) {
      var args = Array.prototype.slice.call(arguments, 1);
      return waitForGasRun_().then(function () {
        return new Promise(function (resolve, reject) {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name].apply(null, args);
        });
      });
    }

    var FIELD_DEFS = [
      { key: 'LINE_CHANNEL_ACCESS_TOKEN', label: 'Messaging API — Channel access token', required: true, area: true,
        hint: 'LINE Developers Console > Messaging API channel > Messaging API > Channel access token (long-lived) > Issue' },
      { key: 'LINE_CHANNEL_SECRET', label: 'Messaging API — Channel secret', required: true,
        hint: 'Messaging API channel > Basic settings > Channel secret' },
      { key: 'LINE_LOGIN_CHANNEL_ID', label: 'LINE Login — Channel ID', required: true,
        hint: 'สร้าง LINE Login channel ใหม่ (Provider เดียวกับ Messaging API) > Basic settings' },
      { key: 'LINE_LOGIN_CHANNEL_SECRET', label: 'LINE Login — Channel secret', required: true, hint: '' },
      { key: 'WEBAPP_BASE_URL', label: 'Web App URL (deploy URL ปัจจุบัน)', required: true,
        hint: 'ระบบ detect ให้อัตโนมัติจาก deployment — กด "ใช้ค่านี้" ได้เลย ต้องตรงกับ Callback URL ที่ตั้งใน LINE Login เป๊ะ ๆ' },
      { key: 'ADMIN_LINE_GROUP_ID', label: 'กลุ่ม LINE แอดมิน (Group ID) — ไม่บังคับ', required: false,
        hint: 'ไว้ push แจ้งเตือนข้อความค้างตอบเกิน 5 นาที เว้นว่างไว้ก่อนได้ ใส่ทีหลังได้' },
      { key: 'WEBHOOK_SECRET', label: 'Webhook secret — ไม่บังคับ (ระบบสุ่มให้อัตโนมัติถ้าเว้นว่าง)', required: false,
        hint: 'ใช้แทนการ verify signature ของ LINE (Apps Script อ่าน header ไม่ได้ — ดู WORKFLOW.md)' },
      { key: 'LIFF_ID', label: 'LIFF ID — ไม่บังคับ', required: false,
        hint: 'สำหรับหน้า "สถานะของฉัน" ของสมาชิก ใส่ทีหลังได้หลังสร้าง LIFF app' }
    ];

    function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

    function renderForm(status) {
      var lockedNote = status.locked
        ? '<div class="alert alert-info small">ตั้งค่าครบแล้ว — การแก้ไขค่าต่อจากนี้ถูกล็อกไว้เฉพาะแอดมินเต็มที่ login แล้วเท่านั้น</div>'
        : '<div class="alert alert-warning small">ยังตั้งค่าไม่ครบ — หน้านี้เปิดให้กรอกได้โดยไม่ต้อง login ชั่วคราว (เพราะ LINE Login ยังใช้งานไม่ได้จนกว่าจะกรอกครบ) พอกรอกครบแล้วหน้านี้จะถูกล็อกอัตโนมัติ</div>';

      var fieldsHtml = FIELD_DEFS.map(function (f) {
        var current = status.values[f.key] || '';
        var input = f.area
          ? '<textarea class="form-control form-control-sm" id="f_' + f.key + '" rows="2" placeholder="' + (current || 'ยังไม่ได้ตั้งค่า') + '"></textarea>'
          : '<input type="text" class="form-control form-control-sm" id="f_' + f.key + '" placeholder="' + (current || 'ยังไม่ได้ตั้งค่า') + '">';
        return '<div class="mb-3"><label>' + esc(f.label) + (f.required ? ' <span class="text-danger">*</span>' : '') + '</label>' +
          (current ? '<div class="hint mb-1">ค่าปัจจุบัน: <code>' + esc(current) + '</code></div>' : '') +
          input + (f.hint ? '<div class="hint mt-1">' + esc(f.hint) + '</div>' : '') + '</div>';
      }).join('');

      document.getElementById('content').innerHTML =
        lockedNote +
        '<div class="card"><div class="card-header">ค่าตั้งค่าระบบ (บันทึกลงชีต "Setting")</div><div class="card-body">' +
        fieldsHtml +
        '<button class="btn btn-success w-100" onclick="doSave()">บันทึก</button>' +
        '</div></div>' +
        '<div class="card"><div class="card-header">Webhook URL สำหรับ LINE Developers Console</div><div class="card-body">' +
        '<p class="hint">เอา URL นี้ไปวางที่ Messaging API channel > Webhook settings > Webhook URL</p>' +
        '<code class="copyable" id="webhookUrlBox">' + (status.locked ? '' : 'บันทึกข้อมูลก่อนเพื่อสร้าง URL') + '</code>' +
        '</div></div>' +
        '<div class="text-center"><a href="' + BASE_URL + '" target="_top" class="btn btn-outline-secondary btn-sm">กลับหน้าแอดมิน</a></div>';

      if (status.locked) loadWebhookPreview();
      var detected = document.getElementById('f_WEBAPP_BASE_URL');
      if (detected && status.detectedWebAppUrl && !status.values.WEBAPP_BASE_URL) {
        detected.insertAdjacentHTML('afterend',
          '<button type="button" class="btn btn-sm btn-outline-primary mt-1" onclick="document.getElementById(\'f_WEBAPP_BASE_URL\').value=' +
          JSON.stringify(status.detectedWebAppUrl) + '">ใช้ค่านี้: ' + esc(status.detectedWebAppUrl) + '</button>');
      }
    }

    function loadWebhookPreview() {
      rpc('getWebhookUrlPreview', TOKEN).then(function (res) {
        if (res.ok && res.url) document.getElementById('webhookUrlBox').textContent = res.url;
      });
    }

    function doSave() {
      var payload = {};
      FIELD_DEFS.forEach(function (f) {
        var el = document.getElementById('f_' + f.key);
        if (el && el.value.trim()) payload[f.key] = el.value.trim();
      });
      rpc('saveSetupProperties', TOKEN, payload).then(function (res) {
        if (!res.ok) { Swal.fire('ผิดพลาด', res.message, 'error'); return; }
        Swal.fire('บันทึกแล้ว', res.locked ? 'ตั้งค่าครบแล้ว ระบบพร้อมใช้งาน' : 'บันทึกบางส่วนแล้ว กรอกส่วนที่เหลือต่อได้', 'success')
          .then(function () { boot(); });
      }).catch(function (err) {
        Swal.fire('ผิดพลาด', String(err), 'error');
      });
    }

    function boot() {
      rpc('getSetupStatus', TOKEN).then(function (res) {
        if (!res.ok) {
          document.getElementById('content').innerHTML =
            '<div class="alert alert-danger">' + esc(res.message) + '</div>' +
            '<a href="' + BASE_URL + '" target="_top" class="btn btn-success">เข้าสู่ระบบด้วย LINE</a>';
          return;
        }
        renderForm(res);
      }).catch(function (err) {
        document.getElementById('content').innerHTML = '<div class="alert alert-danger">เกิดข้อผิดพลาด: ' + esc(err) + '</div>';
      });
    }

    boot();
  </script>
</body>
</html>
